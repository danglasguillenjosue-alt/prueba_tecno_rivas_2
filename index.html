<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registro VIP de Factura</title>
  
  <!-- Aquí conectamos tus estilos -->
  <link rel="stylesheet" href="style.css">
  
  <!-- FontAwesome para los íconos chivos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Librería para el efecto de confeti épico -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Luces de fondo -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main>
    <div id="formWrap" class="glass-panel">
      <div class="header-form">
        <i class="fa-solid fa-ticket-alt logo-icon"></i>
        <h1>Registro VIP</h1>
        <p class="sub">Validá tu factura para participar</p>
      </div>
      
      <form id="f">
        <div class="input-group">
          <i class="fa-solid fa-id-card"></i>
          <input id="ced" name="cedula" type="text" placeholder="Cédula: 000-000000-0000A" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <i class="fa-solid fa-phone"></i>
          <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="Teléfono: 8888-8888" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <i class="fa-solid fa-file-invoice"></i>
          <input id="fac" name="factura" type="text" inputmode="numeric" placeholder="Nº Factura: FAC-00123" required autocomplete="off">
        </div>
        
        <div class="input-group">
          <i class="fa-solid fa-coins"></i>
          <input id="tot" name="total" type="number" step="0.01" min="0" placeholder="Total: C$ 1500.00" required autocomplete="off">
        </div>
        
        <button type="submit" id="btn">
          <span>Validar y Guardar</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        
        <div id="msg"></div>
      </form>
    </div>
    
    <div class="done glass-panel" id="done">
      <div class="done-icon"><i class="fa-solid fa-circle-check"></i></div>
      <h1>¡Éxito Total!</h1>
      <p class="sub">Tu registro ha sido verificado y guardado correctamente.</p>
      <button onclick="location.reload()" class="btn-reload">
        <i class="fa-solid fa-rotate-right"></i> Registrar otra factura
      </button>
    </div>
  </main>

  <!-- Aquí conectamos tu lógica -->
  <script src="script.js"></script>
</body>
</html>
